
name: Nextdash Local Backup

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Synchronize Local Repository

    runs-on: [self-hosted, Windows, X64, nextdash-backup]

    steps:
      - name: Verify backup directory
        shell: powershell
        run: |
          $backup = "C:\GitBackups\Nextdash.git"

          if (!(Test-Path "$backup\HEAD")) {
            throw "Backup repository is missing or invalid!"
          }

          git --git-dir="$backup" rev-parse --is-bare-repository

          if ($LASTEXITCODE -ne 0) {
            throw "Invalid bare Git repository!"
          }

      - name: Synchronize GitHub repository
        shell: powershell
        run: |
          $backup = "C:\GitBackups\Nextdash.git"

          git --git-dir="$backup" remote update --prune

          if ($LASTEXITCODE -ne 0) {
            throw "Backup synchronization failed!"
          }

      - name: Verify backup branches
        shell: powershell
        run: |
          $backup = "C:\GitBackups\Nextdash.git"

          git --git-dir="$backup" branch -r

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to verify backup branches!"
          }

          Write-Output "Backup completed successfully!"
