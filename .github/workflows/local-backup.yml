- name: Verify backup directory
  shell: powershell
  run: |
    git --git-dir="C:\GitBackups\Nextdash.git" rev-parse --is-bare-repository

    if ($LASTEXITCODE -ne 0) {
      throw "Invalid bare Git repository!"
    }

- name: Synchronize GitHub repository
  shell: powershell
  run: |
    git --git-dir="C:\GitBackups\Nextdash.git" remote update --prune

    if ($LASTEXITCODE -ne 0) {
      throw "Backup synchronization failed!"
    }

- name: Verify backup branches
  shell: powershell
  run: |
    git --git-dir="C:\GitBackups\Nextdash.git" branch -r