
name: Nextdash Local Backup

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Synchronize Local Repository

    runs-on:
      - self-hosted
      - Windows
      - X64
      - nextdash-backup

    steps:
      - name: Verify backup directory
        shell: powershell
        run: |
          if (!(Test-Path "C:\Users\ranje\Downloads\dashboard_mirror\Nextdash.git")) {
            throw "Backup repository not found!"
          }

      - name: Synchronize GitHub repository
        shell: powershell
        run: |
          git --git-dir="C:\Users\ranje\Downloads\dashboard_mirror\Nextdash.git" remote update --prune

          if ($LASTEXITCODE -ne 0) {
            throw "Backup synchronization failed!"
          }

      - name: Verify backup branches
        shell: powershell
        run: |
          git --git-dir="C:\Users\ranje\Downloads\dashboard_mirror\Nextdash.git" branch -a

          Write-Output "Backup completed successfully!"
