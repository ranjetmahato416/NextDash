
name: Nextdash Local Backup

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Synchronize Local Repository

    runs-on:
      - self-hosted
      - Windows
      - X64
      - nextdash-backup

    defaults:
      run:
        shell: powershell

    steps:
      - name: Verify backup directory
        run: |
          if (!(Test-Path "C:\GitBackups\Nextdash.git")) {
            throw "Backup repository not found!"
          }

          Write-Output "Backup directory exists."

      - name: Synchronize GitHub repository
        run: |
          git --git-dir="C:\GitBackups\Nextdash.git" remote update --prune

          if ($LASTEXITCODE -ne 0) {
            throw "Backup synchronization failed!"
          }

          Write-Output "Repository synchronized successfully."

      - name: Verify backup branches
        run: |
          git --git-dir="C:\GitBackups\Nextdash.git" branch -a

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to verify backup branches!"
          }

          Write-Output "Backup completed successfully!"
